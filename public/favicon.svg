<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
  xmlns:c2pa="http://c2pa.org/manifest">
  <title>Ruble check</title>
  <style>
    /* light: sidebar-primary (orange-600) -> primary (orange-700) */
    .c1 {
      stop-color: #f97316;
    }

    .c2 {
      stop-color: #c2410c;
    }

    .fg {
      stroke: #fff7ed;
    }

    /* dark: sidebar-primary (orange-500) -> primary (orange-800) */
    @media (prefers-color-scheme: dark) {
      .c1 {
        stop-color: #fb923c;
      }

      .c2 {
        stop-color: #9a3412;
      }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop class="c1" offset="0" />
      <stop class="c2" offset="1" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)" />

  <g class="fg" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- open ring -->
    <path d="M258 401 A153 153 0 1 1 401 272" stroke-width="34" />
    <!-- check mark -->
    <path d="M188 247 L233 292 L320 204" stroke-width="32" />
    <!-- ruble sign -->
    <g stroke-width="24" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M330 428 V314 H368 A29 29 0 0 1 368 372 H330" />
      <path d="M298 372 H374" />
      <path d="M298 402 H374" />
    </g>
  </g>
</svg>